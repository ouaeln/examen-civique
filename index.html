<title>Examen civique — Entraînement QCM</title>
<style>
  :root {
    --paper: #faf9f5;
    --card: #ffffff;
    --ink: #1c2130;
    --ink-soft: #565d70;
    --line: #e3e1d8;
    --bleu: #2743c7;
    --bleu-soft: #eef0fb;
    --rouge: #c0233a;
    --rouge-soft: #fbeef0;
    --vert: #1e7a4c;
    --vert-soft: #eaf5ef;
    --amber: #9a6b00;
    --shadow: 0 1px 3px rgba(28,33,48,.07), 0 8px 24px rgba(28,33,48,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14161f;
      --card: #1d202c;
      --ink: #e9eaf0;
      --ink-soft: #9aa0b3;
      --line: #313547;
      --bleu: #7d93f5;
      --bleu-soft: #232a45;
      --rouge: #f08296;
      --rouge-soft: #3a2229;
      --vert: #6fce9e;
      --vert-soft: #1d3329;
      --amber: #e0b45c;
      --shadow: 0 1px 3px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14161f;
    --card: #1d202c;
    --ink: #e9eaf0;
    --ink-soft: #9aa0b3;
    --line: #313547;
    --bleu: #7d93f5;
    --bleu-soft: #232a45;
    --rouge: #f08296;
    --rouge-soft: #3a2229;
    --vert: #6fce9e;
    --vert-soft: #1d3329;
    --amber: #e0b45c;
    --shadow: 0 1px 3px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 740px; margin: 0 auto; padding: 24px 20px 80px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    border-bottom: 3px double var(--line); padding-bottom: 14px; margin-bottom: 24px;
  }
  .brand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .brand h1 { font-size: 1.35rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .brand .sub { color: var(--ink-soft); font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; }
  .tric { display: inline-block; width: 21px; height: 13px; border-radius: 2px; margin-right: 8px; vertical-align: baseline;
    background: linear-gradient(90deg, #000091 33%, #fff 33% 66%, #e1000f 66%); border: 1px solid var(--line); }
  h2 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 600; font-size: 1.5rem; margin: 0 0 6px; text-wrap: balance; }
  .muted { color: var(--ink-soft); }
  .small { font-size: .85rem; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px;
  }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 620px) { .modes { grid-template-columns: 1fr; } }
  .mode-card { cursor: pointer; transition: transform .12s ease, border-color .12s ease; }
  .mode-card:hover { transform: translateY(-2px); border-color: var(--bleu); }
  .mode-card h3 { margin: 0 0 8px; font-size: 1.1rem; font-family: "Iowan Old Style", Palatino, Georgia, serif; }
  .eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--bleu); font-weight: 700; margin-bottom: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: .85rem; cursor: pointer;
  }
  .chip.on { background: var(--bleu); border-color: var(--bleu); color: #fff; }
  :root[data-theme="dark"] .chip.on, :root:not([data-theme="light"]) .chip.on { color: #14161f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .chip.on { color: #fff; } }

  button.primary {
    background: var(--bleu); color: var(--paper); border: none; border-radius: 8px;
    padding: 11px 22px; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 18px; font-size: .9rem; cursor: pointer;
  }
  button:focus-visible, .chip:focus-visible, .choice:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }

  .qbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .qbar .theme-tag {
    font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700;
    color: var(--bleu); background: var(--bleu-soft); padding: 4px 10px; border-radius: 4px;
  }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; }
  .timer.low { color: var(--rouge); }
  .progress { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .progress > div { height: 100%; background: var(--bleu); border-radius: 3px; transition: width .25s ease; }

  .question { font-size: 1.15rem; font-weight: 600; margin: 4px 0 18px; text-wrap: balance; font-family: "Iowan Old Style", Palatino, Georgia, serif; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    text-align: left; width: 100%; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 8px; padding: 12px 16px; font-size: .97rem; color: var(--ink); cursor: pointer;
    display: flex; gap: 12px; align-items: baseline; line-height: 1.45;
  }
  .choice:hover:not(:disabled) { border-color: var(--bleu); background: var(--bleu-soft); }
  .choice:disabled { cursor: default; }
  .choice .letter { font-weight: 700; color: var(--ink-soft); flex: 0 0 auto; }
  .choice.correct { border-color: var(--vert); background: var(--vert-soft); }
  .choice.correct .letter { color: var(--vert); }
  .choice.wrong { border-color: var(--rouge); background: var(--rouge-soft); }
  .choice.wrong .letter { color: var(--rouge); }
  .choice.picked { border-color: var(--bleu); background: var(--bleu-soft); }

  .explain {
    margin-top: 16px; padding: 13px 16px; border-left: 3px solid var(--vert);
    background: var(--vert-soft); border-radius: 0 8px 8px 0; font-size: .92rem;
  }
  .explain.bad { border-left-color: var(--rouge); background: var(--rouge-soft); }
  .explain b { display: block; margin-bottom: 3px; }

  .navrow { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }

  .score-big { font-size: 3rem; font-weight: 700; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-variant-numeric: tabular-nums; }
  .verdict { display: inline-block; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: .95rem; margin: 8px 0 4px; }
  .verdict.pass { background: var(--vert-soft); color: var(--vert); }
  .verdict.fail { background: var(--rouge-soft); color: var(--rouge); }
  .theme-scores { margin: 18px 0 0; padding: 0; list-style: none; }
  .theme-scores li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
  .theme-scores li:last-child { border-bottom: none; }
  .theme-scores .n { font-variant-numeric: tabular-nums; font-weight: 600; }

  .review-item { border-bottom: 1px solid var(--line); padding: 16px 0; }
  .review-item:last-child { border-bottom: none; }
  .review-item .rq { font-weight: 600; margin-bottom: 6px; }
  .review-item .ra { font-size: .9rem; margin: 2px 0; }
  .ra.good { color: var(--vert); }
  .ra.bad { color: var(--rouge); }
  .review-item .re { font-size: .85rem; color: var(--ink-soft); margin-top: 5px; }

  .exam-note { display: flex; gap: 10px; align-items: baseline; font-size: .88rem; color: var(--ink-soft); margin-top: 10px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 6px; }
  @media (max-width: 560px) { .facts { grid-template-columns: 1fr; } }
  .fact { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-align: center; }
  .fact .v { font-size: 1.5rem; font-weight: 700; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-variant-numeric: tabular-nums; }
  .fact .l { font-size: .78rem; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }
  a { color: var(--bleu); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
"use strict";
/* Banque de questions issue du référentiel officiel (12/2025).
   Format: [thème, question, [bonne réponse, leurre, leurre, leurre], explication] */
const THEMES = {
  P: "Principes et valeurs de la République",
  I: "Système institutionnel et politique",
  D: "Droits et devoirs",
  H: "Histoire, géographie et culture",
  V: "Vivre dans la société française",
  S: "Mise en situation"
};

const BANK = [
/* ---------- PRINCIPES ET VALEURS ---------- */
["P","Complétez les paroles de la Marseillaise : « Allons enfants de la patrie… »",
 ["« Le jour de gloire est arrivé »","« La liberté nous appelle »","« Levons-nous pour la France »","« Le drapeau est levé »"],
 "La Marseillaise, hymne national, a été composée par Rouget de Lisle en 1792."],
["P","Dans le cadre d'un entretien d'embauche, que peut-on demander au candidat ?",
 ["Ses compétences et son expérience professionnelle","Sa religion","Son origine ethnique","Son opinion politique"],
 "Les questions sur la religion, l'origine ou les opinions sont des discriminations interdites par la loi."],
["P","Déclarer ses revenus aux services fiscaux est :",
 ["Une obligation légale","Un choix personnel","Réservé aux personnes riches","Facultatif si on gagne peu"],
 "La déclaration de revenus est obligatoire chaque année pour tous les foyers fiscaux."],
["P","En France, les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?",
 ["Les impôts financent les écoles, les hôpitaux et les routes","Les impôts financent uniquement l'armée","Les impôts sont reversés au Président","Les impôts financent les cultes religieux"],
 "L'impôt finance les services publics : éducation, santé, sécurité, infrastructures."],
["P","La liberté d'association est :",
 ["Le droit de créer ou de rejoindre une association","L'obligation d'adhérer à une association","Réservée aux citoyens français","Soumise à l'accord du préfet"],
 "Garantie par la loi de 1901, elle appartient à toute personne, française ou étrangère."],
["P","Qu'est-ce que la liberté d'association ?",
 ["La liberté de se regrouper avec d'autres personnes autour d'un projet commun, sans but lucratif","L'obligation d'être membre d'un parti politique","Le droit de créer une entreprise pour faire des bénéfices","Le droit de manifester sans déclaration"],
 "Loi du 1er juillet 1901 : plusieurs personnes peuvent librement s'associer dans un but autre que le partage de bénéfices."],
["P","La liberté d'expression sur les réseaux sociaux en France est :",
 ["Autorisée, mais encadrée par la loi","Totale et sans aucune limite","Interdite","Réservée aux journalistes"],
 "L'injure, la diffamation et l'incitation à la haine restent punies par la loi, même en ligne."],
["P","Lequel de ces prénoms évoque un symbole de la République ?",
 ["Marianne","Camille","Jeanne","Victoire"],
 "Marianne, coiffée du bonnet phrygien, incarne la République française."],
["P","Lequel de ces symboles représente la République française ?",
 ["Le drapeau bleu, blanc, rouge","La fleur de lys","L'aigle impérial","La croix de Lorraine"],
 "Le drapeau tricolore est le symbole officiel défini par la Constitution (article 2)."],
["P","Où peut-on voir la devise de la République ?",
 ["Sur les façades des mairies et des bâtiments publics","Uniquement dans les musées","Sur les billets de banque","Dans les églises"],
 "« Liberté, Égalité, Fraternité » figure sur les bâtiments publics et les documents officiels."],
["P","Lesquels sont des symboles officiels de la République française ?",
 ["Le drapeau tricolore, la Marseillaise et Marianne","La tour Eiffel, le coq et le béret","Le croissant, l'étoile et le lion","La baguette, le vin et le fromage"],
 "Les symboles officiels : drapeau, hymne, devise, Marianne et le 14 juillet."],
["P","Peut-on brûler publiquement un drapeau français ?",
 ["Non, c'est interdit et puni par la loi","Oui, au nom de la liberté d'expression","Oui, sauf le 14 juillet","Oui, avec une autorisation"],
 "L'outrage public au drapeau tricolore est une infraction pénale."],
["P","Quand la sécurité sociale a-t-elle été établie en France ?",
 ["En 1945","En 1905","En 1958","En 1981"],
 "La Sécurité sociale a été créée par les ordonnances de 1945, après la Libération."],
["P","Que commémore la fête nationale ?",
 ["La prise de la Bastille, le 14 juillet 1789","La fin de la Seconde Guerre mondiale","Le couronnement de Napoléon","La signature de la Constitution"],
 "Le 14 juillet renvoie à la prise de la Bastille (1789) et à la fête de la Fédération (1790)."],
["P","Que porte Marianne sur la tête ?",
 ["Un bonnet phrygien","Une couronne de laurier","Un béret","Un casque"],
 "Le bonnet phrygien est un symbole de liberté hérité de la Révolution."],
["P","Que signifie le mot « fraternité » dans la devise française ?",
 ["La solidarité et l'entraide entre tous les citoyens","L'amour de la patrie","L'obéissance aux lois","L'égalité des salaires"],
 "La fraternité désigne le lien de solidarité qui unit les membres de la communauté nationale."],
["P","Quel symbole de la République peut-on voir sur les maillots de l'équipe de France de football ?",
 ["Le coq","Marianne","Le bonnet phrygien","La devise républicaine"],
 "Le coq gaulois est un emblème traditionnel de la France, porté par les équipes nationales."],
["P","Quelle est la devise de la République française ?",
 ["Liberté, Égalité, Fraternité","Unie dans la diversité","Travail, Famille, Patrie","Liberté, Justice, Paix"],
 "« Liberté, Égalité, Fraternité » est inscrite à l'article 2 de la Constitution."],
["P","Qu'est-ce qu'une liberté ?",
 ["Un droit fondamental garanti par la loi","Une permission accordée par le gouvernement","Un privilège réservé aux citoyens","Une récompense"],
 "Les libertés fondamentales (expression, conscience, circulation…) sont garanties à tous."],
["P","Selon la Constitution, la France est une République…",
 ["Indivisible, laïque, démocratique et sociale","Fédérale, religieuse et monarchique","Unie, catholique et centralisée","Libérale, royale et démocratique"],
 "C'est la définition donnée par l'article 1er de la Constitution de 1958."],
["P","Sur quel document peut-on voir Marianne ?",
 ["Sur les timbres-poste","Sur le passeport américain","Sur les tickets de métro","Sur la carte bancaire"],
 "Marianne figure sur les timbres, les documents officiels et dans les mairies."],
["P","Une des valeurs de la devise républicaine est l'Égalité. Qu'est-ce que cela signifie ?",
 ["Tous les citoyens ont les mêmes droits et sont égaux devant la loi","Tout le monde gagne le même salaire","Tout le monde a le même travail","Tout le monde paie le même impôt"],
 "L'égalité signifie l'égalité en droits et devant la loi, sans distinction d'origine, de sexe ou de religion."],
["P","Une personne peut-elle changer librement de religion en France ?",
 ["Oui, la liberté de conscience le garantit","Non, c'est interdit","Oui, avec une autorisation de l'État","Seulement une fois dans sa vie"],
 "La laïcité garantit la liberté de croire, de ne pas croire et de changer de religion."],
["P","Selon le principe de laïcité, que signifie la neutralité de l'État ?",
 ["L'État ne favorise et ne finance aucune religion","L'État interdit toutes les religions","L'État choisit une religion officielle","L'État contrôle les croyances"],
 "L'État est neutre : il garantit la liberté de culte sans en reconnaître ni en salarier aucun."],
["P","Que peut faire un usager du service public dans une mairie ?",
 ["Porter un signe religieux","Exiger d'être servi par un agent de sa religion","Refuser de parler à une femme","Imposer ses convictions aux agents"],
 "La neutralité s'impose aux agents publics, pas aux usagers, qui restent libres de porter un signe religieux."],
["P","En France, il est possible pour l'État de financer :",
 ["L'entretien des édifices religieux construits avant 1905","Le salaire des prêtres et des imams","La construction de nouveaux lieux de culte","Les cours de religion à l'école publique"],
 "Les édifices antérieurs à 1905 appartiennent aux communes ou à l'État, qui en assurent l'entretien."],
["P","En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?",
 ["1905","1789","1945","1958"],
 "La loi du 9 décembre 1905 fonde la laïcité française."],
["P","Que dit la loi de 1905 ?",
 ["La République ne reconnaît, ne salarie ni ne subventionne aucun culte","La religion catholique est la religion de l'État","Les religions sont interdites en public","Chaque commune choisit sa religion"],
 "Elle garantit la liberté de conscience et sépare les Églises de l'État."],
["P","Que garantit le principe de laïcité ?",
 ["La liberté de conscience et le libre exercice des cultes","L'interdiction de toutes les religions","Une religion d'État","L'obligation d'être croyant"],
 "La laïcité protège la liberté de croire ou de ne pas croire, dans le respect de l'ordre public."],
["P","Quel jour célèbre-t-on officiellement la laïcité en France ?",
 ["Le 9 décembre","Le 14 juillet","Le 1er mai","Le 8 mars"],
 "Le 9 décembre correspond à l'anniversaire de la loi de 1905."],
["P","Quel symbole religieux peut être porté dans une école publique dans le respect de la laïcité ?",
 ["Un signe religieux discret","Un grand voile couvrant le visage","Une soutane","Aucun signe, même discret"],
 "La loi de 2004 interdit aux élèves les signes religieux ostensibles ; les signes discrets sont autorisés."],
["P","Quel terme désigne précisément la haine ou les préjugés contre les Juifs ?",
 ["L'antisémitisme","Le racisme","La xénophobie","Le sectarisme"],
 "L'antisémitisme est une forme de racisme visant spécifiquement les personnes juives ; il est puni par la loi."],
["P","Quel texte est considéré comme le texte fondateur de la laïcité ?",
 ["La loi du 9 décembre 1905","La Constitution de 1958","Le Code civil","La Déclaration de 1789"],
 "La loi de 1905 de séparation des Églises et de l'État fonde la laïcité."],
["P","Quelle institution française doit rester neutre en matière de religion ?",
 ["L'État et les services publics","Les associations","Les entreprises privées","Les familles"],
 "L'État, les collectivités et les services publics sont soumis à la neutralité religieuse."],
["P","Qu'est-ce que la laïcité ?",
 ["La séparation des religions et de l'État, et la liberté de conscience","L'interdiction de la religion","Une religion officielle de la France","L'obligation d'être athée"],
 "La laïcité repose sur la liberté de conscience, la séparation et l'égalité de tous devant la loi."],
["P","À l'école, la charte de la laïcité permet de :",
 ["Rappeler les règles et les valeurs de la laïcité aux élèves","Interdire les cours d'histoire des religions","Choisir sa religion","Dispenser certains élèves de cours"],
 "Affichée dans les écoles, elle explique le sens de la laïcité à la communauté éducative."],
["P","Qui doit respecter et veiller à la neutralité religieuse dans les services publics ?",
 ["Les agents du service public","Les usagers","Uniquement les directeurs","Personne"],
 "Les agents publics ne peuvent pas manifester leurs convictions religieuses dans leurs fonctions."],
["P","Une personne déclare ne croire en aucun dieu. On peut dire :",
 ["Qu'elle est athée","Qu'elle est laïque","Qu'elle est agnostique","Qu'elle est croyante"],
 "L'athéisme est l'absence de croyance en un dieu. La liberté de conscience protège ce choix."],

/* ---------- SYSTÈME INSTITUTIONNEL ---------- */
["I","Comment est désigné le Premier ministre ?",
 ["Il est nommé par le Président de la République","Il est élu au suffrage universel direct","Il est désigné par le Sénat","Il est tiré au sort"],
 "Le Président de la République nomme le Premier ministre (article 8 de la Constitution)."],
["I","Qui peut se présenter aux élections présidentielles ?",
 ["Tout citoyen français majeur remplissant les conditions d'éligibilité","Uniquement les ministres","Uniquement les députés","Toute personne vivant en France"],
 "Il faut être français, majeur, inscrit sur les listes électorales et recueillir 500 parrainages d'élus."],
["I","À qui appartient la souveraineté nationale ?",
 ["Au peuple","Au Président de la République","Au gouvernement","À l'armée"],
 "« La souveraineté nationale appartient au peuple qui l'exerce par ses représentants et par référendum » (article 3)."],
["I","Qui est élu lors des élections municipales ?",
 ["Les conseillers municipaux","Le maire directement","Les députés","Le préfet"],
 "Les citoyens élisent les conseillers municipaux, qui élisent ensuite le maire."],
["I","L'inscription sur les listes électorales est :",
 ["Obligatoire","Facultative","Payante","Réservée aux plus de 25 ans"],
 "Le code électoral rend l'inscription obligatoire ; elle est automatique à 18 ans pour les jeunes recensés."],
["I","Quelle condition est nécessaire pour voter aux élections présidentielles ?",
 ["Être français, majeur et inscrit sur les listes électorales","Avoir un emploi","Payer des impôts","Être né en France"],
 "Le droit de vote suppose la nationalité française, la majorité et l'inscription sur les listes."],
["I","Quelle condition faut-il remplir pour être candidat aux élections municipales ?",
 ["Être âgé d'au moins 18 ans","Être âgé d'au moins 30 ans","Être propriétaire dans la commune","Être fonctionnaire"],

/* ---------- ÉTAT ---------- */
const app = document.getElementById("app");
const LETTERS = ["A","B","C","D"];
let state = null;
let timerId = null;

document.getElementById("bankinfo").textContent = BANK.length + " questions · référentiel officiel déc. 2025";

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function prepQuestion(entry) {
  const [theme, q, choices, explain] = entry;
  const order = shuffle([0, 1, 2, 3]);
  return { theme, q, explain, choices: order.map(i => choices[i]), answer: order.indexOf(0) };
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

/* ---------- ACCUEIL ---------- */
function home() {
  stopTimer();
  state = null;
  const best = localStorage.getItem("civique-best");
  app.innerHTML = `
    <section class="card">
      <div class="eyebrow">L'examen officiel</div>
      <h2>Comment se passe l'épreuve ?</h2>
      <p class="muted">QCM sur ordinateur : <strong>40 questions en 45 minutes</strong> — 28 questions de connaissance
      et 12 mises en situation. Une seule bonne réponse sur quatre. Il faut <strong>32 bonnes réponses (80 %)</strong> pour réussir.</p>
      <div class="facts">
        <div class="fact"><div class="v">40</div><div class="l">questions</div></div>
        <div class="fact"><div class="v">45 min</div><div class="l">durée max.</div></div>
        <div class="fact"><div class="v">32/40</div><div class="l">pour réussir</div></div>
      </div>
      ${best ? `<p class="small muted">Votre meilleur score en examen blanc : <strong>${esc(best)}/40</strong></p>` : ""}
    </section>
    <div class="modes">
      <section class="card mode-card" id="go-practice" tabindex="0" role="button" aria-label="Mode entraînement">
        <div class="eyebrow">Mode 1</div>
        <h3>Entraînement</h3>
        <p class="muted small">Question par question, avec la correction et une explication immédiates.
        Filtrez par thème pour travailler vos points faibles.</p>
      </section>
      <section class="card mode-card" id="go-exam" tabindex="0" role="button" aria-label="Mode examen blanc">
        <div class="eyebrow">Mode 2</div>
        <h3>Examen blanc</h3>
        <p class="muted small">Conditions réelles : 40 questions tirées au sort (28 connaissances + 12 situations),
        chronomètre de 45 minutes, correction complète à la fin.</p>
      </section>
    </div>`;
  const p = document.getElementById("go-practice"), e = document.getElementById("go-exam");
  p.onclick = practiceSetup; e.onclick = startExam;
  [p, e].forEach(el => el.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); el.click(); } });
}

/* ---------- ENTRAÎNEMENT ---------- */
function practiceSetup() {
  const counts = {};
  BANK.forEach(([t]) => counts[t] = (counts[t] || 0) + 1);
  app.innerHTML = `
    <section class="card">
      <div class="eyebrow">Entraînement</div>
      <h2>Choisissez un thème</h2>
      <div class="chips" id="chips">
        <button class="chip on" data-t="ALL">Tous les thèmes (${BANK.length})</button>
        ${Object.keys(THEMES).map(t => `<button class="chip" data-t="${t}">${THEMES[t]} (${counts[t]})</button>`).join("")}
      </div>
      <div class="navrow">
        <button class="ghost" id="back">← Accueil</button>
        <button class="primary" id="start">Commencer</button>
      </div>
    </section>`;
  let sel = "ALL";
  document.querySelectorAll("#chips .chip").forEach(c => c.onclick = () => {
    document.querySelectorAll("#chips .chip").forEach(x => x.classList.remove("on"));
    c.classList.add("on"); sel = c.dataset.t;
  });
  document.getElementById("back").onclick = home;
  document.getElementById("start").onclick = () => {
    const pool = sel === "ALL" ? BANK : BANK.filter(([t]) => t === sel);
    state = { mode: "practice", qs: shuffle(pool).map(prepQuestion), i: 0, good: 0, answered: false };
    renderPractice();
  };
}

function renderPractice() {
  const q = state.qs[state.i];
  app.innerHTML = `
    <div class="qbar">
      <span class="theme-tag">${THEMES[q.theme]}</span>
      <span class="muted small">Question ${state.i + 1} / ${state.qs.length} · ${state.good} bonne${state.good > 1 ? "s" : ""} réponse${state.good > 1 ? "s" : ""}</span>
    </div>
    <div class="progress"><div style="width:${(state.i / state.qs.length) * 100}%"></div></div>
    <section class="card">
      <p class="question">${esc(q.q)}</p>
      <div class="choices">
        ${q.choices.map((c, i) => `<button class="choice" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${esc(c)}</span></button>`).join("")}
      </div>
      <div id="feedback"></div>
      <div class="navrow">
        <button class="ghost" id="quit">Terminer</button>
        <button class="primary" id="next" hidden>Question suivante →</button>
      </div>
    </section>`;
  document.getElementById("quit").onclick = () => practiceEnd();
  document.querySelectorAll(".choice").forEach(btn => btn.onclick = () => {
    if (state.answered) return;
    state.answered = true;
    const pick = +btn.dataset.i;
    const ok = pick === q.answer;
    if (ok) state.good++;
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
      const i = +b.dataset.i;
      if (i === q.answer) b.classList.add("correct");
      else if (i === pick) b.classList.add("wrong");
    });
    document.getElementById("feedback").innerHTML =
      `<div class="explain ${ok ? "" : "bad"}"><b>${ok ? "Bonne réponse !" : "Mauvaise réponse — la bonne était " + LETTERS[q.answer] + "."}</b>${esc(q.explain)}</div>`;
    const next = document.getElementById("next");
    if (state.i + 1 < state.qs.length) { next.hidden = false; next.onclick = () => { state.i++; state.answered = false; renderPractice(); }; }
    else { next.hidden = false; next.textContent = "Voir le résultat"; next.onclick = practiceEnd; }
  });
}

function practiceEnd() {
  const total = state.answered ? state.i + 1 : state.i;
  const pct = total ? Math.round((state.good / total) * 100) : 0;
  app.innerHTML = `
    <section class="card" style="text-align:center">
      <div class="eyebrow">Entraînement terminé</div>
      <div class="score-big">${state.good} / ${total}</div>
      <p class="muted">${total ? pct + " % de bonnes réponses" + (pct >= 80 ? " — au-dessus du seuil de l'examen (80 %). Continuez !" : " — l'examen demande 80 %. Encore un peu d'entraînement !") : "Aucune question répondue."}</p>
      <div class="navrow" style="justify-content:center; gap:12px">
        <button class="ghost" id="home">← Accueil</button>
        <button class="primary" id="again">Recommencer</button>
      </div>
    </section>`;
  document.getElementById("home").onclick = home;
  document.getElementById("again").onclick = practiceSetup;
}

/* ---------- EXAMEN BLANC ---------- */
function startExam() {
  const knowledge = shuffle(BANK.filter(([t]) => t !== "S")).slice(0, 28);
  const situations = shuffle(BANK.filter(([t]) => t === "S")).slice(0, 12);
  state = {
    mode: "exam",
    qs: shuffle(knowledge.concat(situations)).map(prepQuestion),
    i: 0, picks: new Array(40).fill(null),
    left: 45 * 60
  };
  timerId = setInterval(() => {
    state.left--;
    const el = document.getElementById("timer");
    if (el) {
      el.textContent = fmtTime(state.left);
      el.classList.toggle("low", state.left <= 300);
    }
    if (state.left <= 0) finishExam();
  }, 1000);
  renderExam();
}
function fmtTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}
function renderExam() {
  const q = state.qs[state.i];
  const answered = state.picks.filter(p => p !== null).length;
  app.innerHTML = `
    <div class="qbar">
      <span class="theme-tag">${q.theme === "S" ? "Mise en situation" : "Question de connaissance"}</span>
      <span class="timer" id="timer">${fmtTime(state.left)}</span>
    </div>
    <div class="progress"><div style="width:${(answered / 40) * 100}%"></div></div>
    <section class="card">
      <p class="muted small" style="margin:0 0 4px">Question ${state.i + 1} / 40</p>
      <p class="question">${esc(q.q)}</p>
      <div class="choices">
        ${q.choices.map((c, i) => `<button class="choice ${state.picks[state.i] === i ? "picked" : ""}" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${esc(c)}</span></button>`).join("")}
      </div>
      <div class="navrow">
        <button class="ghost" id="prev" ${state.i === 0 ? "disabled" : ""}>← Précédente</button>
        ${state.i < 39
          ? `<button class="primary" id="next">Suivante →</button>`
          : `<button class="primary" id="finish">Terminer l'examen</button>`}
      </div>
      <div class="exam-note"><span>ℹ️</span><span>${answered}/40 questions répondues. Pas de correction avant la fin, comme le vrai examen. Vous pouvez revenir en arrière.</span></div>
    </section>`;
  document.querySelectorAll(".choice").forEach(btn => btn.onclick = () => {
    state.picks[state.i] = +btn.dataset.i;
    if (state.i < 39) { state.i++; renderExam(); } else renderExam();
  });
  const prev = document.getElementById("prev");
  if (prev) prev.onclick = () => { state.i--; renderExam(); };
  const next = document.getElementById("next");
  if (next) next.onclick = () => { state.i++; renderExam(); };
  const fin = document.getElementById("finish");
  if (fin) fin.onclick = () => {
    const blank = state.picks.filter(p => p === null).length;
    if (blank > 0 && !confirm(blank + " question(s) sans réponse. Terminer quand même ?")) return;
    finishExam();
  };
}
function finishExam() {
  stopTimer();
  let good = 0;
  const perTheme = {};
  const wrong = [];
  state.qs.forEach((q, i) => {
    const ok = state.picks[i] === q.answer;
    if (!perTheme[q.theme]) perTheme[q.theme] = { g: 0, n: 0 };
    perTheme[q.theme].n++;
    if (ok) { good++; perTheme[q.theme].g++; }
    else wrong.push({ q, pick: state.picks[i] });
  });
  const pass = good >= 32;
  const best = +(localStorage.getItem("civique-best") || 0);
  if (good > best) localStorage.setItem("civique-best", String(good));
  app.innerHTML = `
    <section class="card" style="text-align:center">
      <div class="eyebrow">Résultat de l'examen blanc</div>
      <div class="score-big">${good} / 40</div>
      <div class="verdict ${pass ? "pass" : "fail"}">${pass ? "✓ Admis — seuil de 32/40 atteint" : "✗ Non admis — il faut 32/40"}</div>
      <p class="muted small">Temps restant : ${fmtTime(Math.max(0, state.left))}${good > best ? " · Nouveau record !" : ""}</p>
      <ul class="theme-scores">
        ${Object.keys(perTheme).map(t => `<li><span>${THEMES[t]}</span><span class="n">${perTheme[t].g}/${perTheme[t].n}</span></li>`).join("")}
      </ul>
      <div class="navrow" style="justify-content:center; gap:12px">
        <button class="ghost" id="home">← Accueil</button>
        <button class="primary" id="again">Refaire un examen blanc</button>
      </div>
    </section>
    ${wrong.length ? `
    <section class="card">
      <h2 style="font-size:1.15rem">Corrections (${wrong.length} erreur${wrong.length > 1 ? "s" : ""})</h2>
      ${wrong.map(w => `
        <div class="review-item">
          <div class="rq">${esc(w.q.q)}</div>
          ${w.pick !== null ? `<div class="ra bad">✗ Votre réponse : ${esc(w.q.choices[w.pick])}</div>` : `<div class="ra bad">✗ Pas de réponse</div>`}
          <div class="ra good">✓ Bonne réponse : ${esc(w.q.choices[w.q.answer])}</div>
          <div class="re">${esc(w.q.explain)}</div>
        </div>`).join("")}
    </section>` : `<section class="card"><p style="margin:0">Sans faute — félicitations ! 🎉</p></section>`}`;
  document.getElementById("home").onclick = home;
  document.getElementById("again").onclick = startExam;
}

home();
</script>
